[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence-app"
version = "0.1.0"
description = "Local-first Cadence health and training backend"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "httpx>=0.27,<1",
    "garmin-fit-sdk>=21.0",
    "numpy>=2",
    "scipy>=1.13",
    "segno>=1.6",
    "py-vapid>=1.9",
    "http-ece>=1.2",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",  # on-device text recognition for class screenshots
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cadence-app = "cadence_app.server:main"

[tool.setuptools.packages.find]
include = ["cadence_app*"]

[tool.setuptools.package-data]
cadence_app = ["migrations/*.py", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
