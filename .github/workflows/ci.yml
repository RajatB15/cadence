name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: app/backend
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e '.[test]'
      - name: Test
        working-directory: app/backend
        run: .venv/bin/pytest

  frontend:
    name: Frontend (typecheck, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install
        working-directory: app/web
        run: npm ci
      - name: Typecheck
        working-directory: app/web
        run: npm run typecheck
      - name: Test
        working-directory: app/web
        run: npm test
      - name: Build
        working-directory: app/web
        run: npm run build

  research:
    name: BLE research tools (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: research
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e '.[test]'
      - name: Test
        working-directory: research
        run: .venv/bin/pytest
