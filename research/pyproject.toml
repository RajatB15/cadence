[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence-ble"
version = "0.1.0"
description = "BLE research tools for reverse-engineering the Dr Trust 526 Legend scale"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["bleak>=3.0,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cadence = "cadence_ble.cli:main"

[tool.setuptools]
packages = ["cadence_ble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
